[package]
name = "khole"
version = "0.1.0"
description = "DJ track triage for macOS"
authors = ["Tamas"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tomi2400/KHole"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "khole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.6.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
lofty = "0.25.5"
walkdir = "2.5"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
tauri-plugin-dialog = "2"
symphonia = { version = "0.6.1", features = ["all"] }
libc = "0.2.191"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
notify = "8.2.1"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
tauri-plugin-window-state = "2"


# Dev builds are optimized a little (our per-sample loops) and dependencies fully
# (symphonia above all): unoptimized, a 10-minute waveform takes 2 s instead of 0.2 s.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
